<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tirbeo - Sign In</title>
    <meta name="description" content="Sign in to Tirbeo. Access your workspace, collaborate with your team, and manage your projects." />
    <meta name="keywords" content="Tirbeo, sign in, login, workspace, collaboration" />
    <meta name="author" content="Tirbeo" />

    <!-- Open Graph -->
    <meta property="og:title" content="Tirbeo - Sign In" />
    <meta property="og:description" content="Sign in to Tirbeo. Access your workspace, collaborate with your team, and manage your projects." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo-opt.png" />
    <meta property="og:url" content="https://tirbeo.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tirbeo - Sign In" />
    <meta name="twitter:description" content="Sign in to Tirbeo. Access your workspace, collaborate with your team, and manage your projects." />
    <meta name="twitter:image" content="/logo-opt.png" />

    <!-- Favicon: tiny PNG instead of the old 1.1MB .ico -->
    <link rel="icon" type="image/png" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#08080b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f0f0f2" media="(prefers-color-scheme: light)">

    <!-- API preconnect: session check fires on load — warm the connection -->
    <link rel="preconnect" href="https://api.tirbeo.com" crossorigin>

    <!-- Inter: the UI face. display=swap renders in the system stack first, so
         the login card is never blocked waiting on the webfont. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body class="bg-bg text-fg antialiased">
    <div id="root"></div>
  </body>
</html>
