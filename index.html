<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sign in to Tirbeo</title>
    <meta name="description" content="Sign in to Tirbeo. Access your workspace, collaborate with your team, and manage your projects." />
    <meta name="keywords" content="Tirbeo, sign in, login, workspace, collaboration" />
    <meta name="author" content="Tirbeo" />

    <!-- Open Graph -->
    <meta property="og:title" content="Sign in to Tirbeo" />
    <meta property="og:description" content="Sign in to Tirbeo. Access your workspace, collaborate with your team, and manage your projects." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tirbeo" />
    <!-- og:image must be an absolute URL — /logo-white.webp exists in public/. -->
    <meta property="og:image" content="https://tirbeo.com/logo-white.webp" />
    <meta property="og:url" content="https://tirbeo.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sign in to Tirbeo" />
    <meta name="twitter:description" content="Sign in to Tirbeo. Access your workspace, collaborate with your team, and manage your projects." />
    <meta name="twitter:image" content="https://tirbeo.com/logo-white.webp" />

    <!-- Favicon: tiny PNG instead of the old 1.1MB .ico -->
    <link rel="icon" type="image/png" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Chrome colour follows the resolved palette — matches the Apple canvas
         (dark #1c1c1e / light #f2f2f7). -->
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">

    <!-- API preconnect: session check fires on load — warm the connection -->
    <link rel="preconnect" href="https://api.tirbeo.com" crossorigin>
    <!-- Third parties reached during/right after the auth flow. DNS-only
         hints: Turnstile loads only when the API demands a challenge, and
         Pusher is lazy-imported after sign-in — a full preconnect here
         would cost more (speculation rules) than it saves. -->
    <link rel="dns-prefetch" href="https://challenges.cloudflare.com">
    <link rel="dns-prefetch" href="https://ws-mt1.pusher.com">
    <link rel="dns-prefetch" href="https://myprofile.tirbeo.com">

    <!-- Resolve the palette before the first paint so there is no unstyled
         flash. Key "tirbeo:theme"; must stay identical to THEME_BOOT in
         src/lib/theme.ts. -->
    <script>
      (function(){try{var k="tirbeo:theme";var v=localStorage.getItem(k);var t=(v==="dark"||v==="light"||v==="system")?v:"system";var a=t==="light"||(t==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";document.documentElement.setAttribute("data-theme",a);document.documentElement.style.colorScheme=a;}catch(e){}})();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body class="min-h-dvh bg-background font-sans text-foreground antialiased">
    <div id="root"></div>
  </body>
</html>
