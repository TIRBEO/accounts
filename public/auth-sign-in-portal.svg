<svg width="560" height="420" viewBox="0 0 560 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Person securely signing in to a TIRBEO workspace">
  <!-- Background shapes -->
  <circle cx="80" cy="70" r="140" fill="#E8F0FE"/>
  <circle cx="500" cy="370" r="160" fill="#D2E3FC" opacity="0.6"/>
  <circle cx="480" cy="60" r="70" fill="#E8F0FE" opacity="0.5"/>
  <rect x="0" y="356" width="560" height="64" rx="0" fill="#F1F5FB"/>

  <!-- Desk -->
  <rect x="88" y="286" width="384" height="16" rx="8" fill="#3D3D3D"/>
  <rect x="120" y="302" width="20" height="70" rx="6" fill="#2F2F2F"/>
  <rect x="410" y="302" width="20" height="70" rx="6" fill="#2F2F2F"/>

  <!-- Person -->
  <circle cx="284" cy="196" r="34" fill="#2F4FC4"/>
  <path d="M284 236c-40 0-52 22-52 44v22h104v-22c0-22-12-44-52-44z" fill="#243DE6"/>
  <path d="M262 200q22 12 44 0" stroke="#1D4ED8" stroke-width="5" stroke-linecap="round" fill="none"/>
  <rect x="252" y="250" width="64" height="30" rx="14" fill="#243DE6"/>

  <!-- Laptop -->
  <g>
    <rect x="168" y="230" width="224" height="150" rx="14" fill="#202124"/>
    <rect x="180" y="242" width="200" height="118" rx="8" fill="#FFFFFF"/>
    <!-- screen content: mini account portal -->
    <rect x="196" y="258" width="168" height="12" rx="6" fill="#E8EAF5"/>
    <rect x="196" y="278" width="120" height="12" rx="6" fill="#DCE1F5"/>
    <rect x="196" y="298" width="140" height="12" rx="6" fill="#DCE1F5"/>
    <rect x="196" y="318" width="88" height="12" rx="6" fill="#E8EAF5"/>
    <g>
      <path d="M322 270c10 0 18 8 18 18s-8 18-18 18-18-8-18-18 8-18 18-18z" fill="#E8F0FE"/>
      <path d="M322 276a6 6 0 0 1 6 6v2h2v8h-16v-8h2v-2a6 6 0 0 1 6-6z" fill="#1A73E8"/>
      <path d="M319.5 284.5l2 2 3.5-4" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <rect x="150" y="372" width="260" height="10" rx="5" fill="#3D3D3D"/>
  </g>

  <!-- Floating account card -->
  <g>
    <rect x="396" y="150" width="128" height="86" rx="14" fill="#FFFFFF" stroke="#DADCE0"/>
    <circle cx="414" cy="172" r="14" fill="#C2C8E8"/>
    <rect x="436" y="162" width="72" height="9" rx="4.5" fill="#E8EAF5"/>
    <rect x="436" y="176" width="52" height="9" rx="4.5" fill="#DCE1F5"/>
    <rect x="404" y="200" width="112" height="8" rx="4" fill="#E8EAF5"/>
    <rect x="404" y="214" width="72" height="8" rx="4" fill="#E8EAF5"/>
  </g>

  <!-- Floating workspace card -->
  <g>
    <rect x="52" y="128" width="120" height="84" rx="14" fill="#FFFFFF" stroke="#DADCE0"/>
    <rect x="66" y="144" width="92" height="10" rx="5" fill="#E8EAF5"/>
    <rect x="66" y="162" width="66" height="8" rx="4" fill="#DCE1F5"/>
    <g>
      <circle cx="92" cy="190" r="15" fill="#E8F0FE"/>
      <path d="M92 181a6.5 6.5 0 0 1 6.5 6.5v3h-13v-3a6.5 6.5 0 0 1 6.5-6.5z" fill="#1A73E8"/>
      <path d="M89.5 191.5l1.8 1.8 3.4-3.6" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <rect x="114" y="186" width="40" height="8" rx="4" fill="#E8EAF5"/>
  </g>

  <!-- Floating shield with check -->
  <g>
    <path d="M452 46l22-8 22 8v24c0 16-9 30-22 38-13-8-22-22-22-38V46z" fill="#E8F0FE" stroke="#1A73E8" stroke-width="3"/>
    <path d="M459 76l5 5 10-12" stroke="#188038" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Sparkles -->
  <g fill="#1A73E8">
    <path d="M140 60l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path d="M392 100l2.4 5.6 5.6 2.4-5.6 2.4-2.4 5.6-2.4-5.6-5.6-2.4 5.6-2.4z" opacity="0.7"/>
    <path d="M44 240l2 4.8 4.8 2-4.8 2-2 4.8-2-4.8-4.8-2 4.8-2z" opacity="0.6"/>
  </g>
</svg>
